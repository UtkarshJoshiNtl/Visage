[project]
name = "visage"
version = "0.1.0"
description = "System Performance Dashboard — live TUI for CPU, memory, disk, network, and processes"
authors = [{ name = "Anomaly Co." }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["dashboard", "monitoring", "tui", "system", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Benchmarking",
]
dependencies = [
    "psutil>=6.0.0",
    "textual>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
remote = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
tracing = ["bcc"]
gpu = ["nvidia-ml-py>=12.0.0", "amdsmi>=6.0.0"]

[project.urls]
Homepage = "https://github.com/anomalyco/visage"
Repository = "https://github.com/anomalyco/visage"

[project.scripts]
visage = "visage.__main__:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["visage*"]
