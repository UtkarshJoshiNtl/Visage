[project]
name = "visage"
dynamic = ["version"]
description = "System Performance Dashboard — live TUI for CPU, memory, disk, network, and processes"
authors = [{ name = "Anomaly Co." }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["dashboard", "monitoring", "tui", "system", "performance", "linux", "gpu", "process"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Benchmarking",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=6.0.0",
    "textual>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
remote = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
tracing = ["bcc"]
gpu = ["nvidia-ml-py>=12.0.0", "amdsmi>=6.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=1.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/anomalyco/visage"
Repository = "https://github.com/anomalyco/visage"
Issues = "https://github.com/anomalyco/visage/issues"
Documentation = "https://github.com/anomalyco/visage#readme"

[project.scripts]
visage = "visage.__main__:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "visage.__version__"}

[tool.setuptools.packages.find]
include = ["visage*"]

[tool.setuptools.package-data]
visage = ["themes/*.toml"]
